<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BgRemove App Icon">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="g2" x1="128" y1="96" x2="384" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.65"/>
    </linearGradient>
    <pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#EEF2FF"/>
      <rect width="16" height="16" fill="#E5E7EB"/>
      <rect x="16" y="16" width="16" height="16" fill="#E5E7EB"/>
    </pattern>
  </defs>

  <!-- maskable safe area background -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#checker)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="none" stroke="rgba(79,70,229,0.12)" stroke-width="4"/>

  <!-- Gradient blob -->
  <circle cx="256" cy="256" r="164" fill="url(#g)"/>

  <!-- “Cut out” sheen -->
  <path d="M128 220c40-56 120-92 176-76 44 12 76 52 80 100-68 12-156 8-256-24z" fill="url(#g2)"/>

  <!-- Subject silhouette + scissor path -->
  <circle cx="256" cy="232" r="68" fill="white" opacity="0.95"/>
  <path d="M172 336c32-20 76-32 84-32s52 12 84 32" stroke="white" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95"/>
</svg>
