<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self';">\n    <link rel="manifest" href="/manifest.json">\n    <title>App Name - Execution Provider</title>\n    <style>\n        /* Inline critical CSS for layout and responsive design */\n        body { display: flex; }\n        .container { display: grid; grid-template-columns: 2fr 3fr; }\n        .controls, .comparison { padding: 20px; }\n        @media (max-width: 600px) {\n            .container { grid-template-columns: 1fr; }\n        }\n    </style>\n</head>\n<body>\n    <div class="container">\n        <header aria-label="Application Header">\n            <h1>App Name</h1>\n            <p>Execution Provider: XYZ</p>\n        </header>\n        <main>\n            <div class="controls" aria-label="Controls" tabindex="0">\n                <div id="dropzone" aria-label="Drag and Drop Zone" tabindex="0">Drag & Drop Files Here</div>\n                <input type="file" aria-label="File Picker" accept="image/*">\n                <button aria-label="Paste Button" onclick="pasteImage()">Paste</button>\n                <select aria-label="Background Presets">\n                    <option value="preset1">Preset 1</option>\n                    <option value="preset2">Preset 2</option>\n                </select>\n                <input type="range" aria-label="Edge Softness Slider" min="0" max="100" value="50">\n                <div aria-label="Brush Controls" role="group">\n                    <label for="brush-size">Brush Size:</label>\n                    <input type="range" id="brush-size" min="1" max="100">\n                </div>\n                <div aria-label="Batch Mode Checkbox">\n                    <input type="checkbox" id="batch-mode">\n                    <label for="batch-mode">Batch Mode</label>\n                </div>\n            </div>\n            <div class="comparison" aria-label="Before and After Comparison" tabindex="0">\n                <canvas id="comparisonCanvas"></canvas>\n            </div>\n        </main>\n        <footer>\n            <button id="download-png" aria-label="Download PNG">Download PNG</button>\n            <button id="download-jpg" aria-label="Download JPG">Download JPG</button>\n            <div id="toast-container" role="alert" aria-live="polite"></div>\n            <div id="loading-spinner" style="display:none;">Loading...</div>\n        </footer>\n    </div>\n    <script type="module" src="app.js"></script>\n</body>\n</html>
